name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The test suite downloads a mongod binary on first use. Caching it keeps
      # the run to seconds instead of re-fetching ~100 MB every time.
      - name: Cache the in-memory MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Lint
        run: npm run lint

      - name: Regression gates
        run: npm run check:regressions

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build
