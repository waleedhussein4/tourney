name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to deploy
        required: false
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # VITE_SENTRY_DSN is baked into the client bundle at build time, unlike
      # the server-side secrets below, which is why it is set here rather than
      # with `wrangler secret put`. Unset, client Sentry init is a no-op by
      # design, so the build must succeed either way.
      - name: Build client
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # Builds the container image (Docker is available on ubuntu-latest) and
      # deploys the Worker. Runtime secrets — MONGODB_URI, JWT_SECRET,
      # CRON_SECRET, the PADDLE_* values — are Worker secrets set once with
      # `wrangler secret put`, not GitHub secrets, so this step never touches
      # them.
      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.42.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
